<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>VIDHIK Security Verification</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #widget { padding: 8px; }
    #status { color: #627D98; font-size: 12px; text-align: center; padding: 8px; }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</head>
<body>
  <div>
    <div id="widget"></div>
    <div id="status">Preparing secure verification…</div>
  </div>
  <script>
    (function () {
      function post(payload) {
        try {
          if (window.TurnstileBridge && window.TurnstileBridge.postMessage) {
            window.TurnstileBridge.postMessage(JSON.stringify(payload));
          }
        } catch (e) {
          /* channel unavailable */
        }
      }

      var params = new URLSearchParams(window.location.search);
      var sitekey = params.get('sitekey') || '';
      var statusEl = document.getElementById('status');

      function renderToken(token) {
        if (!token) return;
        statusEl.textContent = 'Verified. Returning to VIDHIK…';
        post({ type: 'token', token: token });
      }

      window.onTurnstileLoad = function () {
        if (!sitekey) {
          statusEl.textContent = 'Verification is not configured on the server.';
          post({ type: 'error', message: 'CAPTCHA site key is not configured on the server.' });
          return;
        }
        statusEl.textContent = 'Complete the challenge below.';
        try {
          window.turnstile.render('#widget', {
            sitekey: sitekey,
            theme: 'light',
            callback: renderToken,
            'error-callback': function (code) {
              var message = 'Verification failed (' + code + '). Please retry.';
              statusEl.textContent = message;
              post({ type: 'error', code: code, message: message });
            },
            'expired-callback': function () {
              statusEl.textContent = 'Challenge expired. Please complete it again.';
              post({ type: 'error', message: 'Challenge expired. Please complete it again.' });
            }
          });
        } catch (e) {
          statusEl.textContent = 'Unable to start verification.';
          post({ type: 'error', message: 'Unable to start verification: ' + e });
        }
      };
    })();
  </script>
</body>
</html>
